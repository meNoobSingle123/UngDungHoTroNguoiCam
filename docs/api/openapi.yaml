openapi: 3.1.0
info:
  title: Sign Comm API
  version: 1.0.0
servers:
  - url: http://localhost:8080
security:
  - firebaseJwt: []
paths:
  /v1/me:
    get:
      operationId: getMe
      responses:
        '200':
          $ref: '#/components/responses/Profile'
        '401':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteMe
      responses:
        '204':
          description: Đã xóa tài khoản và toàn bộ dữ liệu
  /v1/cards:
    get:
      operationId: pullCards
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            maximum: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
  /v1/cards/sync:
    post:
      operationId: pushCards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
  /v1/settings:
    get:
      operationId: getSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    put:
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: OK
  /v1/library/packs:
    get:
      operationId: listPacks
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PackSummary'
components:
  securitySchemes:
    firebaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Profile:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Profile'
    Problem:
      description: Lỗi (RFC 9457)
      content:
        application/problem+json:
          schema:
            type: object
  schemas:
    Profile:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    Card:
      type: object
      required: [id, content, updatedAt, deleted]
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
          maxLength: 140
        topic:
          type: string
        icon:
          type: string
        pinned:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        deleted:
          type: boolean
        seq:
          type: integer
          format: int64
    CardPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        nextCursor:
          type: integer
          format: int64
    CardOp:
      allOf:
        - $ref: '#/components/schemas/Card'
        - type: object
          required: [opId]
          properties:
            opId:
              type: string
              format: uuid
    SyncRequest:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CardOp'
    SyncResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [opId, status]
            properties:
              opId:
                type: string
                format: uuid
              status:
                type: string
                enum: [APPLIED, DUPLICATE, SERVER_WINS]
              item:
                $ref: '#/components/schemas/Card'
    Settings:
      type: object
      properties:
        fontLevel:
          type: integer
          minimum: 0
          maximum: 3
        highContrast:
          type: boolean
        speechRate:
          type: number
        dominantHand:
          type: string
          enum: [left, right]
    PackSummary:
      type: object
      required: [id, version, wordCount, url, sha256]
      properties:
        id:
          type: string
        version:
          type: string
        wordCount:
          type: integer
        url:
          type: string
          format: uri
        sha256:
          type: string

