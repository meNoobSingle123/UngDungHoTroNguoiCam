name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  node-and-release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Node test suite
        run: npm test
      - name: Verify MockEngine exclusion in release sources/bundles
        run: npm run check:release-bundle

  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Spring Boot 4.1 backend (Flyway + Testcontainers PostgreSQL)
        working-directory: backend
        run: ./mvnw -B verify

