services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nguoicam}
      POSTGRES_USER: ${POSTGRES_USER:-nguoicam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nguoicam}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nguoicam} -d ${POSTGRES_DB:-nguoicam}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nguoicam}
      DB_USER: ${POSTGRES_USER:-nguoicam}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nguoicam}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-project}
    ports:
      - "8080:8080"

