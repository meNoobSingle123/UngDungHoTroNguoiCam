spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nguoicam}
spring.datasource.username=${DB_USER:nguoicam}
spring.datasource.password=${DB_PASSWORD:nguoicam}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

app.firebase.project-id=${FIREBASE_PROJECT_ID:demo-project}
app.firebase.jwk-set-uri=${FIREBASE_JWKS_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
